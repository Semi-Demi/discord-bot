services:
  mariadb:
    build:
      context: .
      dockerfile: mariadb/Dockerfile
    container_name: mariadb-discord
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  python-bot:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: python-discord-bot
    restart: unless-stopped
    env_file: ".env"
    networks:
      - internal-network
      - internet-network
    depends_on:
      mariadb:
        condition: service_healthy
  redbot:
    build:
      context: .
      dockerfile: RedBot/Dockerfile
    container_name: redbot-discord
    env_file: RedBot/.env
    restart: unless-stopped
    volumes:
      - redbot_data:/data
    networks:
      - internet-network
  lavalink:
    build:
      context: .
      dockerfile: Lavalink/Dockerfile
    container_name: redbot-lavalink
    env_file: Lavalink/.env
    restart: unless-stopped
    networks:
      - internet-network
volumes:
  db_data:
  redbot_data:
networks:
  internal-network:
    internal: true
  internet-network:
